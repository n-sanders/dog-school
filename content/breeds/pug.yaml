slug: pug
name: Pug
dogCeoPath: pug
group: toy
size: small
origin: China
summary: A charming, square little dog with a wrinkled, flat face.
traits:
  - text: Large, round head with a very short, flat muzzle and deep wrinkles.
    source: akc
  - text: Fawn or black coat; fawn pugs have a black mask and black ears.
    source: akc
  - text: Tail curled tightly over the hip - ideally a double curl.
    source: akc
  - text: Compact, square, muscular body ("multum in parvo" - a lot of dog in a small space).
    source: akc
