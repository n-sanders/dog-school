slug: beagle
name: Beagle
dogCeoPath: beagle
group: hound
size: small
origin: England
summary: A merry, compact scenthound bred to hunt rabbits in packs.
traits:
  - text: Short, hard coat, most often tricolor (black saddle, tan and white).
    source: akc
  - text: Long, wide ears that hang down close to the cheeks.
    source: akc
  - text: Tail carried up (gaily) with a white tip, so hunters can see it in tall grass.
    source: akc
  - text: Large brown or hazel eyes with a gentle, pleading expression.
    source: akc
