summary: An energetic ranch dog known for its striking merle coat and often blue or odd-colored eyes.
traits:
  - text: Coat colors include blue merle, red merle, black and red, often with copper and white trim.
    source: akc
  - text: Eyes may be brown, blue, amber, or a mix, including one of each color.
    source: akc
  - text: Medium-length coat with a moderate mane, and a tail that is often naturally short or docked.
    source: akc
  - text: Triangular ears that break forward or to the side.
    source: akc
