slug: golden-retriever
name: Golden Retriever
dogCeoPath: retriever/golden
group: sporting
size: large
origin: Scotland
summary: A gentle, eager-to-please gundog famous for its flowing golden coat.
traits:
  - text: Medium-length, dense coat that may be straight or wavy, in shades of gold from light cream to deep red-gold.
    source: akc
  - text: Feathering (longer hair) on the back of the legs, the chest, the underside and the tail.
    source: akc
  - text: Tail carried level or with a slight upward curve, well feathered.
    source: akc
  - text: Broad skull, straight muzzle and friendly, intelligent expression.
    source: akc
lookAlikes: [ labrador-retriever ]
