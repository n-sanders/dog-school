slug: siberian-husky
name: Siberian Husky
dogCeoPath: husky
group: working
size: medium
origin: Siberia (Russia)
summary: A fast, light sled dog famous for its striking facial mask and blue eyes.
traits:
  - text: Medium-sized and lightly built for speed - smaller and lighter than a Malamute.
    source: akc
  - text: Eyes may be blue, brown, or one of each.
    source: akc
  - text: Erect, triangular ears set close together high on the head.
    source: akc
  - text: Bushy tail carried in a "sickle" curve over the back when alert, but not tightly curled.
    source: akc
