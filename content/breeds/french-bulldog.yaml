slug: french-bulldog
name: French Bulldog
dogCeoPath: bulldog/french
group: non-sporting
size: small
origin: France
summary: A small, playful bulldog best known for its upright "bat ears".
traits:
  - text: Large, upright "bat ears" that are wide at the base and rounded at the top.
    source: akc
  - text: Square, flat-topped head with a short, pushed-in muzzle.
    source: akc
  - text: Compact, muscular body that is much smaller and lighter than the English Bulldog.
    source: akc
  - text: Short, smooth coat; common colors include brindle, fawn and cream.
    source: akc
