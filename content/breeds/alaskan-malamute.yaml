slug: alaskan-malamute
name: Alaskan Malamute
dogCeoPath: malamute
group: working
size: large
origin: Alaska (United States)
summary: A powerful, heavy-boned freight sled dog built for strength rather than speed.
traits:
  - text: Large and heavy-boned - noticeably bigger and bulkier than a Siberian Husky.
    source: akc
  - text: Eyes are always brown; blue eyes are a fault in this breed.
    source: akc
  - text: Ears are small for the size of the head and set wide apart.
    source: akc
  - text: Plumed tail carried over the back "like a waving plume".
    source: akc
