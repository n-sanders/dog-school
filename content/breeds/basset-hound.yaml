origin: France
summary: A low, heavy scenthound with a superb nose and very long ears.
traits:
  - text: Very short legs on a long, heavy-boned body.
    source: akc
  - text: Extremely long, velvety ears that can reach past the nose.
    source: akc
  - text: Loose skin with wrinkles on the brow and droopy lower eyelids that give a sad expression.
    source: akc
  - text: Smooth, short coat, usually tricolor or red and white.
    source: akc
